<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiel | Werwolf</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>
    <script defer type="module" src="game.js"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="img/icon512_rounded.png">
</head>

<body>

    <header>
        <h1>
            <a href="index.html">Werwolf</a>
        </h1>
        <button id="menuButton">☰</button>

        <nav id="menu" aria-label="Hauptnavigation">
            <a href="index.html">Startseite</a>
            <a href="instructions.html">Anleitung</a>
            <a href="about.html">Über uns</a>
        </nav>
    </header>


    <main class="main-content">
        <section id="loadingScreen">
            <div class="loading-content">
                <div class="loading-spinner"></div>

                <h2 id="loadingTitle">Spiel wird vorbereitet...</h2>

                <p id="loadingText">
                    Bitte einen Moment warten.
                </p>

                <div class="loading-bar">
                    <div id="loadingProgress"></div>
                </div>

                <div id="loadingPercentage">0 %</div>
            </div>
        </section>


        <section class="middle">
            <div class="startSection" id="startSection">
                <h3>Seid ihr bereit?</h3>
                <p>Schaltet die Lautstärke ein und setzt euch so hin das jeder das Gerät erreichen kann.</p>

                <button class="start-btn" id="startButton">Spiel starten</button>
            </div>
        </section>


        <section id="selectionContainer" class="middle">
            <p id="task" class="selectionTask"></p>
            <div id="selectionButtons"></div>
        </section>
    </main>







    <footer>
        <p>&copy; 2026 Werwolf. Alle Rechte vorbehalten.</p>

        <nav aria-label="Rechtliche Navigation">
            <a href="imprint.html">Impressum</a>
            <a href="privacy.html">Datenschutz</a>
        </nav>
    </footer>

</body>

</html>
